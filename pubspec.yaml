name: sports_in
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  animated_toggle_switch: ^0.8.5
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  toast: ^0.3.0
  flutter_native_splash: ^2.4.7
  google_fonts: ^6.3.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.2.1
  dio: ^5.9.0
  get_it: ^8.2.0
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  
