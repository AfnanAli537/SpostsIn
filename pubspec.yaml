name: sports_in
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  animated_toggle_switch: ^0.8.5
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  toast: ^0.3.0
  flutter_native_splash: ^2.4.7
  google_fonts: ^6.3.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.2.0
  dio: ^5.9.0
  flutter_svg: ^2.2.1
  equatable: ^2.0.7
  
flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
